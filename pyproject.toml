[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krisk"
version = "0.9.0"
description = "MCP-native living research and ECharts visualization for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "napjon" }]
keywords = ["jupyter", "visualization", "echarts", "mcp", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.116",
  "ibis-framework[duckdb,postgres]>=12,<13",
  "ipython>=8.30",
  "jinja2>=3.1",
  "mcp>=1.28,<2",
  "nbformat>=5.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow>=19",
  "pydantic>=2.11",
  "sqlglot>=27",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "pyyaml>=6.0",
  "ruff>=0.12",
]

[project.scripts]
krisk = "krisk.cli:app"

[project.urls]
Homepage = "https://github.com/napjon/krisk"
Repository = "https://github.com/napjon/krisk"
Issues = "https://github.com/napjon/krisk/issues"
Documentation = "https://github.com/napjon/krisk/tree/master/docs"

[tool.hatch.build.targets.wheel]
packages = ["krisk"]

[tool.hatch.build.targets.wheel.force-include]
"skills/save-research-notebook" = "krisk/skills/save-research-notebook"

[tool.hatch.build.targets.sdist]
include = [
  "/krisk",
  "/skills",
  "/docs",
  "/notebooks/*.ipynb",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/krisk.toml.example",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "krisk/cli.py",
  "krisk/compiler.py",
  "krisk/export.py",
  "krisk/rendering.py",
  "krisk/server.py",
  "krisk/service.py",
  "krisk/sources.py",
  "krisk/specs.py",
  "krisk/storage.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["krisk/tests"]

[tool.pytest.ini_options]
testpaths = ["krisk/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:krisk.*",
]

[tool.coverage.run]
source = ["krisk"]
omit = ["krisk/tests/*"]
